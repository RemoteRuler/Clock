<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead Calculator - Remote Ruler</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .dead-calculator-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }
        .dead-calculator-controls label {
            font-size: 1.1em;
            color: var(--text-secondary);
        }
        .dead-calculator-controls input[type="date"] {
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 1em;
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--input-bg);
            color: var(--text-primary);
        }
        .action-button {
            padding: 10px 24px;
            font-size: 0.9em;
            font-weight: 500;
            font-family: 'JetBrains Mono', monospace;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            background-color: var(--primary-action);
            color: white;
        }
        .action-button:hover {
            background-color: var(--primary-action-hover);
        }
        .dead-calculator-result {
            margin-top: 25px;
            font-size: 1.2em;
            color: var(--heading-color);
            font-weight: 700;
            min-height: 25px;
        }
    </style>
</head>
<body class="theme-dead-calc">
    <a href="index.html" class="back-link">← Home</a>
    <div class="main-content-container">

        <h2>Death Calculator</h2>
        
        <div class="dead-calculator-controls">
            <label for="birth-date-dead">Select Your Date of Birth</label>
            <input type="date" id="birth-date-dead">
            <button id="calculate-dead-time" class="action-button">Calculate Remaining Time</button>
        </div>

        <div class="dead-calculator-result"></div>
    </div>
    <script src="dead_calculator_script.js"></script>
    <footer class="copyright-footer">
        <p>&copy; <span id="current-year"></span> Remote Ruler. All rights reserved.</p>
    </footer>
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
